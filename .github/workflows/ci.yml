name: CI

# Runs on every pull request, and on pushes to main so the branch that is
# eventually published is checked in its own right.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Deliberately first and deliberately dependency-free: the leak gate is
  # stdlib-only, so it needs no install step and reports before anything slower
  # has finished. It is a separate job so its verdict is a named check rather
  # than a step buried inside another one.
  #
  # WHY THE DENY LIST ARRIVES FROM A SECRET AND NOT FROM THE TREE. Four of the
  # gate's five rules need no configuration. The fifth, `deny-name`, needs the
  # employee names it is looking for -- and those names are themselves the
  # confidential data. Committing them would publish the thing the rule exists to
  # protect, and committing hashes of them would too: human names are low-entropy
  # and trivially enumerable against a hash. So `tools/leak_scan.toml` keeps
  # `names = []` with the comment explaining why, and the terms arrive at scan
  # time from a file outside the tree.
  #
  # The file is written into RUNNER_TEMP rather than the workspace, deliberately:
  # the scanner enumerates the tree with `git ls-files`, so a deny list inside the
  # checkout would be a file the gate could scan and a contributor could commit.
  #
  # WHY `--require-deny-names 1` IS NOT OPTIONAL HERE. Until this was wired up the
  # job ran with no deny file at all, so `deny-name` compiled zero patterns and
  # matched nothing -- for months, reporting green the whole time. The obvious fix
  # (point the scanner at a secret) does not close it, because the failure repeats
  # the moment the secret is unset, emptied or malformed: a *missing* deny file
  # raises, but an empty file, a bare `[deny]` table and `names = []` all load
  # silently with zero names. An unset secret writes an empty file, the path
  # exists, the missing-file guard never fires, and the rule is inert again behind
  # a green check. Exit code alone cannot distinguish that from a working gate.
  # The flag asserts a positive count of loaded name terms, so the job fails on
  # the emptiness itself rather than reporting a clean scan.
  #
  # THE FORK LIMITATION, STATED RATHER THAN DISCOVERED. Actions secrets are not
  # available to `pull_request` runs from forks. Once this repository is public,
  # `deny-name` will therefore NOT fire on fork contributions, and the job says so
  # in an annotation rather than failing them -- a fork PR cannot supply the
  # secret and failing it would block every outside contribution. That is
  # acceptable against the threat model: the risk this rule addresses is a
  # maintainer copying code across from the private tree and bringing a name with
  # it, which is an in-repo branch push by someone with write access, and those
  # runs do receive the secret. It is written down because a rule that silently
  # does not apply on one trigger is exactly how the original gap was born.
  #
  # Provisioning -- the secret's name, the TOML shape it holds, and how to
  # reconstruct it -- is in docs/leak-scan-provisioning.md. No name appears there.
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the commit-message step below reads `git log --all`,
          # and the default shallow clone would hand it a handful of commits
          # while reporting a clean scan over the rest.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Write the out-of-tree deny list
        env:
          DENY_TOML: ${{ secrets.LEAK_SCAN_DENY_TOML }}
        # printf rather than echo: echo interprets backslashes in some shells, and
        # a mangled TOML document would fail as a parse error rather than as the
        # missing-secret it actually was.
        run: printf '%s' "$DENY_TOML" > "$RUNNER_TEMP/leak-scan-deny.toml"
      - name: Internal identifier leak scan
        env:
          LEAK_SCAN_DENY_FILE: ${{ runner.temp }}/leak-scan-deny.toml
          # True only for a pull_request from a fork. On push this is false, so a
          # branch push is always held to the full gate.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning title=deny-name is not in force on this run::Actions secrets are unavailable to pull_request runs from forks, so the deny-name rule has no terms here and cannot fire. The other four rules ran. See the comment above the leak-scan job."
            python3 tools/leak_scan.py
          else
            python3 tools/leak_scan.py --require-deny-names 1
          fi
      # The step above scans FILE CONTENT AT HEAD -- leak_scan.py
      # enumerates with `git ls-files --cached`. It has never seen a commit
      # message, while this repository's convention deliberately routes ticket
      # refs into messages and PR descriptions. Once this repo is public, a name
      # or an internal hostname in a message cannot be removed without
      # rewriting history, so it has to be refused on the branch push instead.
      #
      # `internal-ticket` is waived for messages only (DEC-155, an accepted
      # decision); the tree scan above still refuses a ticket key in a file. The
      # scan proves it is not vacuous with a synthetic sentinel before reporting
      # any verdict -- see tools/scan_commit_messages.py.
      - name: Internal identifiers in commit messages
        env:
          LEAK_SCAN_DENY_FILE: ${{ runner.temp }}/leak-scan-deny.toml
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning title=deny-name is not in force on this run::Actions secrets are unavailable to pull_request runs from forks, so the deny-name rule has no terms for the commit-message scan either. The pattern rules ran."
            python3 tools/scan_commit_messages.py
          else
            python3 tools/scan_commit_messages.py --require-deny-names 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # An editable install of the real project, not a bare pytest run: this is
      # also the check that the pinned core dependencies still resolve.
      - name: Install
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest

  # Deliberately installs the project WITHOUT the dev extra: the portability claim
  # is that the reference engine runs on the core dependencies alone. Installing
  # the test extra here would let a transitive vendor dependency satisfy an import
  # the check exists to refuse.
  import-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install core only
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e .
      - name: Import closure and demo build with every cloud SDK blocked
        run: python3 tools/import_closure_check.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect \
            --source=/repo \
            --verbose \
            --redact
